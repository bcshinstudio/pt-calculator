<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f9fd" />
  <title>PT Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="intro" aria-labelledby="page-title">
      <div class="title-row">
        <span class="icon-tile title-icon"><img src="assets/snowflake.svg" alt="" /></span>
        <div class="title-copy">
          <h1 id="page-title">PT Calculator</h1>
          <p>Select a refrigerant and enter a temperature to find the saturation pressure,<br class="desktop-break" />
             or enter a pressure to find the saturation temperature.</p>
        </div>
        <div class="tool-mark" aria-hidden="true">
          <span>HVACR TOOL</span>
          <small>PRESSURE&nbsp; · &nbsp;TEMPERATURE</small>
        </div>
      </div>
    </section>

    <section class="calculator-card" aria-label="Pressure temperature calculator">
      <div class="field-group">
        <label for="refrigerant">
          <span class="icon-tile blue"><img src="assets/refrigerant.svg" alt="" /></span>
          <span>Refrigerant</span>
        </label>
        <div class="control-indent">
          <select id="refrigerant" autocomplete="off"></select>
        </div>
      </div>

      <div id="saturation-wrap" class="field-group hidden">
        <label for="saturation-point">
          <span class="icon-tile blue"><img src="assets/saturation.svg" alt="" /></span>
          <span>Saturation Point</span>
        </label>
        <div class="control-indent">
          <select id="saturation-point" autocomplete="off">
            <option value="dew">Dew</option>
            <option value="bubble">Bubble</option>
          </select>
          <p class="field-note">Dew is normally used for superheat. Bubble is normally used for subcooling.</p>
        </div>
      </div>

      <div class="field-group">
        <label for="temperature">
          <span class="icon-tile orange"><img src="assets/thermometer.svg" alt="" /></span>
          <span>Temperature (°F)</span>
        </label>
        <div class="control-indent">
          <input id="temperature" type="number" inputmode="decimal" step="any" placeholder="e.g. 70" autocomplete="off" />
        </div>
      </div>

      <div class="field-group">
        <label for="pressure">
          <span class="icon-tile green"><img src="assets/pressure-gauge.svg" alt="" /></span>
          <span>Pressure (PSIG)</span>
        </label>
        <div class="control-indent">
          <input id="pressure" type="number" inputmode="decimal" step="any" placeholder="e.g. 200" autocomplete="off" />
        </div>
      </div>

      <div id="message" class="message control-indent" role="status" aria-live="polite"></div>

      <div class="status-row">
        <p id="data-status" class="data-status"></p>
        <p class="units-note">ALL PRESSURES IN PSIG</p>
      </div>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
